[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unifi-mcp"
version = "0.4.0"
description = "Production-grade Python MCP server for UniFi Site Manager, Network, and Protect APIs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [{ name = "millsmillsymills" }]
keywords = ["unifi", "mcp", "model-context-protocol", "ubiquiti", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=3.4.7,<3.5",
    "httpx>=0.28.1,<0.29",
    "pydantic>=2.13.3,<2.14",
    "pydantic-settings>=2.14.2,<2.15",
    "tenacity>=9.1.4,<9.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.2",
    "ty>=0.0.70",
    "bandit[toml]>=1.9.4",
    "pre-commit>=4.6.2",
    "hypothesis>=6.165.10",
    "pip-audit==2.10.1",
]

[tool.uv]
# starlette/pyjwt/cryptography arrive transitively via fastmcp; the versions it pins carry
# advisories pip-audit flags (starlette PYSEC-2026-161, pyjwt PYSEC-2026-175/177/178/179,
# cryptography PYSEC-2026-3552). Force patched floors without bumping the fastmcp pin.
override-dependencies = ["starlette>=1.3.1", "pyjwt[crypto]>=2.13.0", "cryptography>=50.0.0"]

[project.scripts]
unifi-mcp = "unifi_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/millsymills-com/unifi-mcp"
Repository = "https://github.com/millsymills-com/unifi-mcp"
Issues = "https://github.com/millsymills-com/unifi-mcp/issues"

# =============================================================================
# Ruff — linting and formatting
# =============================================================================
[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
    "PT",   # flake8-pytest-style
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate (commented-out code)
    "PL",   # pylint
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "TID",  # flake8-tidy-imports
]
ignore = [
    "PLR0913", # too many function arguments — tool functions need many params
    "PLR0915", # too many statements — registration functions register many tools
    "PLR2004", # magic value comparison — acceptable in tests
    "PLC0415", # import not at top level — intentional for lazy loading and circular dep avoidance
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert is fine in tests
    "ARG001",  # unused function args (fixtures)
    "PLR2004", # magic values in tests
    "S106",    # hardcoded passwords in test fixtures
    "PLR0917", # pytest injects fixtures and parametrize values by keyword; nothing calls a test
]
# FastMCP introspects type annotations at runtime, so Context/FastMCP must not be behind TYPE_CHECKING
"src/unifi_mcp/tools/**/*.py" = [
    "TC001",   # application imports needed at runtime for FastMCP annotation introspection
    "TC002",   # third-party imports needed at runtime for FastMCP annotation introspection
]
# Operator-facing CLI scripts print to stdout intentionally
"scripts/**/*.py" = [
    "T201",    # print is the script's output channel
]

[tool.ruff.lint.isort]
known-first-party = ["unifi_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# =============================================================================
# ty — strict type checking
# =============================================================================
[tool.ty]
src.include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.13"

[tool.ty.rules]
unused-ignore-comment = "warn"
possibly-unresolved-reference = "warn"

# Tests are type-checked (#292), but three rules fire only on pydantic-settings /
# FastMCP test idioms that are correct at runtime and which ty cannot model:
#   - invalid-argument-type: passing "k" where a SecretStr field is annotated
#     (pydantic coerces str -> SecretStr).
#   - unknown-argument: BaseSettings' special `_env_file` init kwarg.
#   - unresolved-attribute: `.fn` on `mcp.get_tool() -> Tool | None`.
# Relaxed for tests/ only so real type errors elsewhere in the suite still fail.
[[tool.ty.overrides]]
include = ["tests/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unknown-argument = "ignore"
unresolved-attribute = "ignore"

# =============================================================================
# Pytest — testing
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require live UniFi hardware (deselect with '-m \"not integration\"')",
    "disruptive: marks integration tests that bounce ports, kick clients, or restart devices. Skipped unless UNIFI_MCP_TEST_ALLOW_DISRUPTIVE=1.",
    "slow: marks tests that are slow to run",
    "live_write: marks live integration tests that mutate controller state; an unexpected ToolError aborts the session (#271).",
    "write_gated: marks integration tests skipped unless write mode is enabled; the collection guard requires these to also carry live_write (#290).",
]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-x",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:httpx.*",
]

[tool.coverage.run]
source = ["unifi_mcp"]
branch = true
omit = ["tests/*", "src/unifi_mcp/__main__.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
    "@overload",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# =============================================================================
# Bandit — security scanning
# =============================================================================
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # assert_used — fine in production code for invariants

# =============================================================================
# Hatch — build configuration
# =============================================================================
[tool.hatch.build.targets.wheel]
packages = ["src/unifi_mcp"]
